<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <style>
      .t{font-size:27px;font-weight:800;fill:#0f172a}
      .s{font-size:15px;fill:#64748b}
      .h{font-size:17px;font-weight:700;fill:#0f172a}
      .b{font-size:13.5px;fill:#334155}
      .cap{font-size:12.5px;font-weight:700;fill:#fff}
      .note{font-size:13px;fill:#475569}
      .big{font-size:15px;font-weight:700;fill:#0f172a}
    </style>
  </defs>

  <text x="40" y="48" class="t">The same idea, in plain terms: a shrinking keycard</text>
  <text x="40" y="76" class="s">You hand an AI assistant an errand. Instead of giving it your master key, you give it a keycard that can only ever be copied smaller.</text>

  <!-- YOU -->
  <g>
    <circle cx="130" cy="230" r="60" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
    <text x="130" y="222" text-anchor="middle" class="h">YOU</text>
    <text x="130" y="246" text-anchor="middle" class="b">(the boss)</text>
    <rect x="60" y="305" width="140" height="70" rx="10" fill="#6366f1"/>
    <text x="130" y="330" text-anchor="middle" class="cap">MASTER KEYCARD</text>
    <text x="130" y="352" text-anchor="middle" font-size="12" fill="#e0e7ff">opens everything you</text>
    <text x="130" y="368" text-anchor="middle" font-size="12" fill="#e0e7ff">are allowed to open</text>
  </g>

  <!-- ASSISTANT -->
  <g>
    <circle cx="440" cy="230" r="60" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="440" y="215" text-anchor="middle" class="h">ASSISTANT</text>
    <text x="440" y="238" text-anchor="middle" class="b">does the thinking:</text>
    <text x="440" y="256" text-anchor="middle" class="b">figures out the steps</text>
    <rect x="365" y="305" width="150" height="70" rx="10" fill="#0891b2"/>
    <text x="440" y="330" text-anchor="middle" class="cap">SMALLER CARD</text>
    <text x="440" y="352" text-anchor="middle" font-size="12" fill="#cffafe">only this errand,</text>
    <text x="440" y="368" text-anchor="middle" font-size="12" fill="#cffafe">a time + spend limit</text>
  </g>

  <!-- HELPER -->
  <g>
    <circle cx="750" cy="230" r="55" fill="#ecfeff" stroke="#0e7490" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="750" y="222" text-anchor="middle" class="h">HELPER</text>
    <text x="750" y="245" text-anchor="middle" class="b">a sub-task</text>
    <rect x="685" y="305" width="130" height="70" rx="10" fill="#0e7490"/>
    <text x="750" y="330" text-anchor="middle" class="cap">SMALLER STILL</text>
    <text x="750" y="352" text-anchor="middle" font-size="12" fill="#cffafe">only its one job —</text>
    <text x="750" y="368" text-anchor="middle" font-size="12" fill="#cffafe">nothing more</text>
  </g>

  <!-- DOOR -->
  <g>
    <rect x="1000" y="170" width="120" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <circle cx="1108" cy="248" r="6" fill="#16a34a"/>
    <text x="1060" y="140" text-anchor="middle" class="h">THE DOOR</text>
    <text x="1060" y="345" text-anchor="middle" class="b">a website, your</text>
    <text x="1060" y="363" text-anchor="middle" class="b">email, a file</text>
  </g>

  <!-- arrows -->
  <line x1="200" y1="230" x2="378" y2="230" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="290" y="215" text-anchor="middle" class="note">gives a copy…</text>
  <text x="290" y="200" text-anchor="middle" class="note" font-weight="700" fill="#b45309">smaller</text>

  <line x1="500" y1="230" x2="693" y2="230" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="600" y="215" text-anchor="middle" class="note">…even smaller</text>
  <text x="600" y="200" text-anchor="middle" class="note" font-weight="700" fill="#b45309">smaller again</text>

  <line x1="805" y1="230" x2="998" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="905" y="215" text-anchor="middle" class="note">unlocks just this</text>

  <!-- THE GUARD / turnstile -->
  <rect x="40" y="430" width="1080" height="150" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="2.5"/>
  <path d="M74,452 L86,452 L86,462 Q86,472 80,476 Q74,472 74,462 Z" fill="#b45309"/>
  <text x="98" y="466" class="big" fill="#b45309">Every card is checked at a guard desk before any door opens</text>
  <text x="66" y="496" class="b">The guard (a security layer that sits under the AI) does four simple things on every single step:</text>
  <text x="80" y="524" class="b">•  Is this card real, and does it open <tspan font-weight="700">this</tspan> door?  If not — blocked.</text>
  <text x="80" y="550" class="b">•  Out of time or money?  Each card has a budget that ticks down, then stops.</text>
  <text x="640" y="524" class="b">•  Copying for a helper?  The copy is <tspan font-weight="700" fill="#b45309">always smaller</tspan> — never bigger.</text>
  <text x="640" y="550" class="b">•  A receipt records who did what, for whom, at every step.</text>

  <!-- WHY IT MATTERS -->
  <rect x="40" y="610" width="530" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="640" class="h">Why this is safer than today</text>
  <text x="60" y="666" class="b">Right now assistants often carry something closer to</text>
  <text x="60" y="686" class="b">the master key. If one gets tricked, it can open far</text>
  <text x="60" y="706" class="b">more than the errand needed. A shrinking card means</text>
  <text x="60" y="724" class="b">a tricked assistant can only ever do the small thing.</text>

  <rect x="590" y="610" width="530" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="610" y="640" class="h">The honest catch</text>
  <text x="610" y="666" class="b">This keeps a fooled assistant from doing <tspan font-weight="700">big</tspan> damage.</text>
  <text x="610" y="686" class="b">It does <tspan font-weight="700">not</tspan> stop it from being fooled in the first place —</text>
  <text x="610" y="706" class="b">it can still do the wrong small thing it was allowed</text>
  <text x="610" y="724" class="b">to do. That's a separate problem, for the AI itself.</text>

  <text x="40" y="752" class="s" fill="#94a3b8">The shrinking-keycard idea isn't new — a 1994 system called Telescript worked this way. Today's AI plumbing is only now catching up.</text>
</svg>
